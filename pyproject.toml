[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riot-retrieve"
version = "0.2.1"
description = "CLI tool to pull match history into SQLite and inspect personal stats"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.26.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.scripts]
rr = "riot_retrieve.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
